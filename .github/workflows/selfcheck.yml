name: selfcheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly (UTC). The macOS jobs are not per-PR checks since #365: the maintainer's local run
    # already happens under Apple's bash 3.2, so this catches a BSD-only regression on main
    # within a day instead of holding every merge for ~12 minutes.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    # The nine commands below are the whole pull-request job; they run unchanged on every event.
    # The full mutant driver run lives in selfcheck-driver below (#526), so this ceiling (15, #477)
    # no longer grows with the registry.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash dev/selfcheck.sh
      - run: bash dev/selfcheck-tests.sh
      - run: bash dev/doctor-tests.sh
      - run: bash dev/hook-tests.sh
      - run: bash dev/cleanup-tests.sh
      - run: bash dev/planning-tests.sh
      - run: bash dev/lock-tests.sh
      - run: bash dev/stop-tests.sh
      - run: bash dev/mutant-driver-tests.sh

  selfcheck-driver:
    # The mutant driver, split out of selfcheck (#526) and sharded four ways: each shard is a
    # parallel job running a deterministic slice of whole (suite, filter) groups (dev/mutant-driver.sh
    # --shard). Declared against its partner in dev/selfcheck.sh 4.9's split_jobs, so together with
    # selfcheck it must still run every dev/*.sh exactly once. Post-merge, nightly and manual
    # dispatch only — never a pull request, so the required `selfcheck` check is unaffected.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Per-shard ceiling.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history (#464): the driver step below diffs github.event.before..HEAD to select
        # which registry records a push can affect. A shallow checkout would make that diff fail
        # against the missing base — safe, since the driver falls back to a full run, but this
        # keeps that fallback for a genuinely unusable base only, not every push.
        with:
          fetch-depth: 0
      # The driver's suites spend most of their wall clock waiting, not computing, so it runs
      # more jobs than the runner has cores. MUTANT_DRIVER_SINCE (#464) selects, on a push, only
      # the registry records the pushed range can affect; schedule/dispatch runs pass it empty,
      # so every record runs. MUTANT_DRIVER_SHARD (#526) then takes this job's slice of whatever
      # set that leaves. Both are passed only through env:, never interpolated into shell text —
      # and the step line stays a bare `bash dev/mutant-driver.sh`, which is the shape 4.9 counts.
      - run: bash dev/mutant-driver.sh
        env:
          MUTANT_DRIVER_JOBS: 8
          MUTANT_DRIVER_SHARD: ${{ matrix.shard }}
          MUTANT_DRIVER_SINCE: ${{ github.event_name == 'push' && github.event.before || '' }}

  selfcheck-macos-driver:
    # The mutant driver's own bash-3.2 run, split out of selfcheck-macos (#471) so the two macOS
    # jobs run in parallel instead of one runner absorbing both, and sharded four ways like
    # selfcheck-driver above (#526). Post-merge, selfcheck-driver already runs the driver (#464:
    # only the records the pushed range can affect), so this job is nightly and manual dispatch
    # only. Declared against its partner in dev/selfcheck.sh 4.9's split_jobs, so together with
    # selfcheck-macos it must still run every dev/*.sh exactly once. Must NOT be the file's last
    # job — see selfcheck-macos's own comment below for why that job stays last.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # Per-shard ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same PATH pin as selfcheck-macos below — see that job's comment for why /bin comes first.
      - run: echo /bin >> "$GITHUB_PATH"
      - name: pin check — fail loudly if this is not the bash 3.2 userland
        run: |
          command -v bash
          bash --version | head -1
          /bin/bash --version | head -1
          bash --version | head -1 | grep -q 'version 3\.2' || {
            echo "PATH bash is not 3.2 — this job would not be testing the BSD/3.2 userland"; exit 1; }
      # Nightly and manual dispatch only, not post-merge: selfcheck-driver already runs the driver
      # after every merge, and the registry's recorded sets are the same on both shells. Fewer
      # concurrent mutants than on ubuntu: the macOS runner has fewer cores, and an oversubscribed
      # one stretched the hook suite's timing cases past their budgets (#527). The shard is
      # passed only through env:, never interpolated into shell text.
      - run: bash dev/mutant-driver.sh
        env:
          MUTANT_DRIVER_JOBS: 4
          MUTANT_DRIVER_SHARD: ${{ matrix.shard }}

  selfcheck-macos:
    # Post-merge and nightly only (#365) — never a pull_request check. Keep this job LAST in the
    # file: dev/selfcheck-tests.sh's 4.9-uneven-jobs case deletes the workflow's final line, which
    # must therefore stay a `- run:` step line — the plain `dev/mutant-driver-tests.sh` run below,
    # not the driver, which runs in the selfcheck-macos-driver job above (#471).
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Apple's /bin/bash is 3.2.57 (last GPLv2 bash). Put /bin first so bare `bash` — including
      # the nested invocations inside both test harnesses — is that 3.2 shell, not a newer bash
      # that may sit earlier in the image's PATH.
      - run: echo /bin >> "$GITHUB_PATH"
      - name: pin check — fail loudly if this is not the bash 3.2 userland
        run: |
          command -v bash
          bash --version | head -1
          /bin/bash --version | head -1
          bash --version | head -1 | grep -q 'version 3\.2' || {
            echo "PATH bash is not 3.2 — this job would not be testing the BSD/3.2 userland"; exit 1; }
      - run: bash dev/selfcheck.sh
      - run: bash dev/selfcheck-tests.sh
      - run: bash dev/doctor-tests.sh
      - run: bash dev/hook-tests.sh
      - run: bash dev/cleanup-tests.sh
      - run: bash dev/planning-tests.sh
      - run: bash dev/lock-tests.sh
      - run: bash dev/stop-tests.sh
      - run: bash dev/mutant-driver-tests.sh
