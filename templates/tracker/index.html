<title>@REPO_NAME@ tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column. Summary first (progress, where we stand, waiting on you), then the
   early hand-written sections, people, what shipped, the other sections, and last the full detail
   per milestone. */
:root {
  --bg: #f3f5f1; --surface: #ffffff; --ink: #17201a; --muted: #5b675e; --line: #d9dfd6; --accent: #1d6a4a;
  --done: #1f7a47; --done-bg: #e0f2e6;
  --active: #9a5c00; --active-bg: #fbeed6;
  --ready: #0d6b78; --ready-bg: #dbf0f2;
  --wait: #646d68; --wait-bg: #eceee9;
  --warn: #a6461e; --warn-bg: #fbe8de;
  --f-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1411; --surface: #161d18; --ink: #e5ebe6; --muted: #98a59c; --line: #2a332d; --accent: #6fd1a2;
  --done: #63d39c; --done-bg: #14301f; --active: #f0b45a; --active-bg: #352610;
  --ready: #62c8d2; --ready-bg: #0f2d33; --wait: #98a59c; --wait-bg: #212923;
  --warn: #ff9c73; --warn-bg: #3a2016; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #161d18; --ink: #e5ebe6; --muted: #98a59c; --line: #2a332d; --accent: #6fd1a2;
  --done: #63d39c; --done-bg: #14301f; --active: #f0b45a; --active-bg: #352610;
  --ready: #62c8d2; --ready-bg: #0f2d33; --wait: #98a59c; --wait-bg: #212923;
  --warn: #ff9c73; --warn-bg: #3a2016; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; overflow-wrap: anywhere; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 36px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 44px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); font-weight: 800; line-height: 1.05; }
h2 { font-size: 23px; font-weight: 700; }
h2.eyebrow { font-family: var(--f-mono); font-size: 12px; font-weight: 400; letter-spacing: 0.06em; }
h3 { font-size: 16.5px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.mono { font-family: var(--f-mono); font-size: 0.86em; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
section { display: grid; gap: 16px; min-width: 0; }
.sec-head { display: grid; gap: 6px; }
.sec-head p { color: var(--muted); max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.notice { background: var(--active-bg); color: var(--active); border-radius: 8px; padding: 10px 14px; font-size: 14.5px; }
.empty { padding: 13px 16px; color: var(--muted); font-size: 14.5px; }
.src { font-size: 13px; color: var(--muted); }

header { display: grid; gap: 14px; }
header .lead { max-width: 70ch; font-size: 17px; }
.live { font-size: 13.5px; color: var(--muted); display: flex; gap: 6px 14px; align-items: center; flex-wrap: wrap; }
.live > span, .live > a { display: inline-flex; align-items: center; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); flex: none; }
.dot.on { background: var(--done); }
.dot.mid { background: var(--active); }
.dot.bad { background: var(--warn); }

.progress { display: grid; gap: 12px; padding: 18px 20px; }
.prog-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px 28px; flex-wrap: wrap; }
.big { font-family: var(--f-display); font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
.seg { display: flex; gap: 3px; }
.seg i { flex: 1 1 0; min-width: 2px; height: 12px; border-radius: 2px; background: var(--wait-bg); border: 1px solid var(--line); }
.seg i.done { background: var(--done); border-color: var(--done); }
.seg i.active { background: var(--active); border-color: var(--active); }
.seg i.ready { background: var(--ready-bg); border-color: var(--ready); }
.seg i.warn { background: var(--warn); border-color: var(--warn); }
.seg.thin i { height: 8px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.stand { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.stand > div { padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.stand .k { font-size: 13px; color: var(--muted); }
.stand ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14.5px; }
@media (max-width: 780px) { .stand { grid-template-columns: 1fr; } }

.diagram { overflow-x: auto; padding: 14px 10px 6px; }
.diagram svg { display: block; height: auto; }
svg .edge { fill: none; stroke: var(--muted); stroke-width: 1.4; }
svg .edge.in { stroke-dasharray: 4 4; }
svg .arrowhead { fill: var(--muted); }
svg .nid { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
svg .nname { font-family: var(--f-body); font-size: 14px; font-weight: 600; fill: var(--ink); }
svg .node { stroke-width: 1.6; fill: var(--wait-bg); stroke: var(--wait); }
svg .node.done { fill: var(--done-bg); stroke: var(--done); }
svg .node.active { fill: var(--active-bg); stroke: var(--active); }
svg .node.ready { fill: var(--ready-bg); stroke: var(--ready); }
svg .node.late { fill: var(--warn-bg); stroke: var(--warn); }
svg .inbox { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 3; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); padding: 8px 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 10px; border-radius: 2px; border: 1.5px solid var(--wait); background: var(--wait-bg); }
.sw.done { border-color: var(--done); background: var(--done-bg); }
.sw.active { border-color: var(--active); background: var(--active-bg); }
.sw.ready { border-color: var(--ready); background: var(--ready-bg); }
.sw.late { border-color: var(--warn); background: var(--warn-bg); }
.sw.input { border: 1.2px dashed var(--line); background: var(--surface); }

.pill, .mx-s { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; line-height: 1.2; padding: 4px 9px; border-radius: 999px; background: var(--wait-bg); color: var(--wait); }
.pill { white-space: nowrap; }
.pill::before, .mx-s::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill.done { background: var(--done-bg); color: var(--done); }
.pill.active { background: var(--active-bg); color: var(--active); }
.pill.ready { background: var(--ready-bg); color: var(--ready); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.mx-s { max-width: 16rem; }
.mx-s[data-m="good"] { background: var(--done-bg); color: var(--done); }
.mx-s[data-m="partial"] { background: var(--active-bg); color: var(--active); }
.mx-s[data-m="bad"] { background: var(--warn-bg); color: var(--warn); }
.mx-s[data-m="waiting"] { background: var(--ready-bg); color: var(--ready); }
.mx-s[data-m="none"] { background: transparent; color: var(--muted); padding-left: 0; }
.mx-s[data-m="none"]::before { display: none; }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14.5px; overflow-wrap: normal; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td .why { color: var(--muted); font-size: 13.5px; margin-top: 3px; max-width: 62ch; }
td .refs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.kind { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.who { white-space: nowrap; }
.btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; margin-top: 8px; display: block; }
.btn:hover { border-color: var(--accent); }
.err { color: var(--warn); font-size: 13px; }
.mx th[scope="row"] { text-transform: none; letter-spacing: 0; font-size: 14.5px; font-weight: 500; color: var(--ink); white-space: normal; min-width: 10rem; }
.mx tr:last-child th[scope="row"] { border-bottom: 0; }
.mx th[scope="row"] .refs { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 4px; font-weight: 400; }

.issues { overflow: hidden; }
.issue { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.issue:last-child { border-bottom: 0; }
.issue.plain { grid-template-columns: minmax(0, 1fr) auto; }
.issue .n { font-family: var(--f-mono); font-size: 13px; font-weight: 500; padding-top: 2px; }
.issue .body { display: grid; gap: 4px; min-width: 0; }
.issue .ttl { font-weight: 600; }
.issue .sub { font-size: 13px; color: var(--muted); font-weight: 400; }
.issue .what { font-size: 14px; color: var(--muted); }
.issue .st { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; align-items: center; max-width: 22rem; }
@media (max-width: 560px) {
  .issue { grid-template-columns: 52px minmax(0, 1fr); }
  .issue.plain { grid-template-columns: minmax(0, 1fr); }
  .issue .st { grid-column: -2 / -1; justify-content: flex-start; }
}

details.fold > summary { cursor: pointer; padding: 13px 16px; font-size: 14.5px; font-weight: 500; color: var(--accent); }
details.fold[open] > summary { border-bottom: 1px solid var(--line); }
.issue + details.fold { border-top: 0; }

.ms-head { display: grid; gap: 8px; }
.ms-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.phase { display: grid; gap: 8px; }

.gaps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gap { padding: 15px 17px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.gap p { font-size: 14.5px; color: var(--muted); }
.gap .act { color: var(--ink); font-size: 14.5px; }
.gap .act b { font-weight: 600; color: var(--accent); }
@media (max-width: 780px) { .gaps { grid-template-columns: 1fr; } }
ol.next { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; }
ol.next li { counter-increment: n; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 14px 16px; }
ol.next li::before { content: counter(n); font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--accent); line-height: 1.1; }
ol.next li p { font-size: 14.5px; color: var(--muted); margin-top: 2px; }
.prose { display: grid; gap: 10px; max-width: 70ch; }

footer { font-size: 13.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 6px; max-width: 78ch; }
@media (prefers-reduced-motion: no-preference) { .pill { transition: background-color .2s; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>@REPO_NAME@ tracker</h1>
    <div id="head"></div>
  </header>
  <div class="wrap" id="app" style="padding:0;max-width:none"><p class="muted">Loading the latest status...</p></div>
</div>

<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var head = document.getElementById("head");
  var model = { harness: null, narrative: null, sections: [], people: [], canWrite: false, db: null };
  var failed = false;
  var SVGNS = "http://www.w3.org/2000/svg";
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // Every database value reaches the page as text (textContent or a text node), never as markup,
  // and a link's href is set only for an https: value.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = String(text); }
    return n;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      var k = arguments[i];
      if (k === null || k === undefined) { continue; }
      parent.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
    }
    return parent;
  }
  function safeHref(v) {
    var s = String(v == null ? "" : v);
    if (s.indexOf("https:") !== 0) { return null; }
    try {
      var u = new URL(s);
      return u.protocol === "https:" ? u.href : null;
    } catch (e) { return null; }
  }
  function link(text, href) {
    var h = safeHref(href);
    if (!h) { return el("span", null, text); }
    var a = el("a", null, text);
    a.setAttribute("href", h);
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener noreferrer");
    return a;
  }
  function arr(v) { return Array.isArray(v) ? v : []; }
  function own(map, k) { return map && Object.prototype.hasOwnProperty.call(map, k) ? map[k] : undefined; }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function str(v) { return typeof v === "string" || (typeof v === "number" && isFinite(v)) ? String(v) : ""; }
  function cut(v, n) { var t = str(v); return t.length > n ? t.slice(0, n) + "…" : t; }
  function docExists(d) { return typeof d.exists === "function" ? d.exists() : !!d.exists; }
  function day(iso) {
    var d = new Date(String(iso || ""));
    if (isNaN(d.getTime())) { return String(iso || ""); }
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()];
  }
  function clock(iso) {
    var d = new Date(String(iso || ""));
    if (isNaN(d.getTime())) { return ""; }
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getUTCHours()) + ":" + p(d.getUTCMinutes()) + " UTC";
  }
  function itemLink(kind, n, url, repoUrl) {
    var fallback = repoUrl ? repoUrl + (kind === "pr" ? "/pull/" : "/issues/") + n : "";
    return link((kind === "pr" ? "PR #" : "#") + n, url || fallback);
  }
  // Text with each #<n> turned into a link to that issue of this repo.
  function rich(parent, text, ctx) {
    var s = str(text), re = /(^|[^\w&\/#])#(\d{1,7})(?![\w])/g, last = 0, m;
    while ((m = re.exec(s)) !== null) {
      var at = m.index + m[1].length;
      if (at > last) { parent.appendChild(document.createTextNode(s.slice(last, at))); }
      var issue = ctx.byNum[m[2]];
      parent.appendChild(itemLink("issue", m[2], issue ? issue.url : "", ctx.repoUrl));
      last = at + m[2].length + 1;
    }
    if (last < s.length) { parent.appendChild(document.createTextNode(s.slice(last))); }
    return parent;
  }

  // state -> [pill colour class, label]
  var STATE = {
    "done": ["done", "Done"], "not-planned": ["", "Won't do"], "merged": ["done", "Merged"], "closed": ["", "Closed"],
    "pr-open": ["active", "PR open"], "approved": ["active", "Plan approved"],
    "planned": ["ready", "Plan to review"], "unplanned": ["ready", "Not planned yet"],
    "held": ["", "Held"], "parked": ["", "Parked"], "external": ["", "Waits on others"],
    "blocked": ["warn", "Blocked"], "needs-human": ["warn", "Needs you"],
    "open": ["warn", "Open"], "in-progress": ["active", "In progress"], "unconfirmed": ["", "To confirm"]
  };
  var REASON_TEXT = {
    "needs-human": "Needs you",
    "ci-failing": "CI failing",
    "governance-path": "Only you can merge",
    "awaiting-review": "Awaiting review",
    "plan-proposed": "Plan to review",
    "solo-merge": "No second review"
  };
  var REASON_CLS = { "needs-human": "warn", "ci-failing": "warn", "governance-path": "active", "awaiting-review": "active", "plan-proposed": "ready" };
  function pill(cls, text) { return el("span", "pill" + (cls ? " " + cls : ""), text); }
  function statePill(s) {
    var p = own(STATE, String(s));
    return p ? pill(p[0], p[1]) : pill("", String(s));
  }
  function reasonText(r) { var t = own(REASON_TEXT, String(r)); return t === undefined ? String(r) : t; }
  function reasonPill(r) { return pill(own(REASON_CLS, String(r)) || "", reasonText(r)); }
  function segClass(state) { var p = own(STATE, String(state)); return p ? p[0] : ""; }
  var SEG_ORDER = ["done", "active", "warn", "ready", ""];
  var SEG_MAX = 60, SOLO_INLINE = 3, RECENT_SHOWN = 10;
  // One segment per issue; past SEG_MAX issues, one segment per colour, as wide as its share.
  function segBar(issues, thin) {
    var bar = el("div", "seg" + (thin ? " thin" : ""));
    bar.setAttribute("aria-hidden", "true");
    var sorted = issues.slice().sort(function (a, b) {
      return SEG_ORDER.indexOf(segClass(a.state)) - SEG_ORDER.indexOf(segClass(b.state));
    });
    if (sorted.length <= SEG_MAX) {
      sorted.forEach(function (i) {
        var s = el("i", segClass(i.state));
        s.title = "#" + i.number + " " + str(i.title);
        bar.appendChild(s);
      });
    } else {
      SEG_ORDER.forEach(function (cls) {
        var n = sorted.filter(function (i) { return segClass(i.state) === cls; }).length;
        if (n === 0) { return; }
        var s = el("i", cls);
        s.style.flexGrow = String(n);
        bar.appendChild(s);
      });
    }
    return bar;
  }
  // Rows folded behind one line. A re-render (every database update) keeps a fold the viewer
  // opened, for as long as the page stays loaded.
  var openFolds = {};
  function fold(key, label, rows) {
    var d = el("details", "fold");
    d.open = openFolds[key] === true;
    d.appendChild(el("summary", null, label));
    rows.forEach(function (r) { d.appendChild(r); });
    d.addEventListener("toggle", function () { openFolds[key] = d.open; });
    return d;
  }
  function isSolo(it) { return !!it && typeof it === "object" && it.reason === "solo-merge"; }
  function sectionShell(title, text, ctx) {
    var s = el("section");
    var hd = el("div", "sec-head");
    hd.appendChild(typeof title === "string" ? el("h2", null, title) : title);
    if (text) { hd.appendChild(ctx ? rich(el("p"), text, ctx) : el("p", null, text)); }
    s.appendChild(hd);
    return s;
  }
  var NOTE_TEXT = 400, LEAD_TEXT = 700, CARDS_MAX = 12;
  function note(ctx, n) { return cut(own(ctx.notes, String(n)), NOTE_TEXT); }

  function issueRow(issue, ctx) {
    var row = el("div", "issue");
    add(row, add(el("div", "n"), itemLink("issue", issue.number, issue.url, ctx.repoUrl)));
    var body = el("div", "body");
    var ttl = el("div", "ttl", issue.title || "");
    if (issue.pr) { add(ttl, " ", add(el("span", "sub"), "· ", link("PR #" + issue.pr.number, issue.pr.url))); }
    body.appendChild(ttl);
    var nt = note(ctx, issue.number);
    if (nt) { body.appendChild(rich(el("div", "what"), nt, ctx)); }
    row.appendChild(body);
    var st = el("div", "st");
    if (issue.waiting) {
      var w = el("span", "pill", "Waits on ");
      arr(issue.blockedBy).filter(function (b) { return b && b.open; }).forEach(function (b, i) {
        if (i > 0) { w.appendChild(document.createTextNode(", ")); }
        w.appendChild(link("#" + b.number, b.url));
      });
      st.appendChild(w);
    }
    st.appendChild(statePill(issue.state));
    row.appendChild(st);
    return row;
  }
  function refPills(parent, nums, ctx, withTitle) {
    arr(nums).forEach(function (n) {
      var issue = ctx.byNum[n];
      parent.appendChild(itemLink("issue", n, issue ? issue.url : "", ctx.repoUrl));
      if (issue && withTitle) { parent.appendChild(el("span", "muted", str(issue.title))); }
      if (issue) { parent.appendChild(statePill(issue.state)); }
    });
  }

  function headBlock(h) {
    var eb = document.getElementById("eyebrow");
    head.textContent = "";
    eb.textContent = "";
    var box = el("div");
    box.style.display = "grid"; box.style.gap = "14px";
    if (!h) { return; }
    add(eb, link(str(h.repo), h.repoUrl), " · " + str(h.defaultBranch) + " @ " + str(h.mainSha).slice(0, 7));
    var lead = model.narrative ? cut(model.narrative.lead, LEAD_TEXT) : "";
    if (lead) { box.appendChild(el("p", "lead", lead)); }
    var live = el("p", "live");

        if (!ph || typeof ph !== "object") { return; }
        var p = el("div", "phase");
        p.appendChild(el("h3", null, String(ph.name || "")));
        if (ph.text) { p.appendChild(rich(el("p", "muted"), ph.text, ctx)); }
        var c = el("div", "issues card");
        arr(ph.issues).forEach(function (n) {
          var issue = ctx.byNum[n];
          if (issue) { c.appendChild(issueRow(issue, ctx)); }
          else { c.appendChild(add(el("div", "issue plain"), add(el("div", "n"), itemLink("issue", n, "", ctx.repoUrl)))); }
        });
        p.appendChild(c);
        box.appendChild(p);
      });
    } else if (d.kind === "list") {
      var c2 = el("div", "issues card");
      arr(d.items).forEach(function (it) {
        if (!it || typeof it !== "object") { return; }
        var row = el("div", "issue plain");
        row.appendChild(add(el("div", "body"), rich(el("div"), it.text || "", ctx)));
        var st = el("div", "st");
        refPills(st, it.issues, ctx, d.titles === true);
        if (Number.isInteger(it.pr) && it.pr > 0 && ctx.repoUrl) { st.appendChild(itemLink("pr", it.pr, "", ctx.repoUrl)); }
        row.appendChild(st);
        c2.appendChild(row);
      });
      box.appendChild(c2);
    } else if (d.kind === "matrix") {
      box.appendChild(matrixBlock(d, ctx));
    } else if (d.kind === "path") {
      box.appendChild(pathBlock(d));
    } else if (d.kind === "cards") {
      var g = el("div", "gaps");
      arr(d.cards).slice(0, CARDS_MAX).forEach(function (cd) {
        if (!cd || typeof cd !== "object") { return; }
        var card = el("div", "gap card");
        card.appendChild(rich(el("h3"), cd.title, ctx));
        if (str(cd.text)) { card.appendChild(rich(el("p"), cd.text, ctx)); }
        if (str(cd.fix)) { card.appendChild(rich(add(el("div", "act"), el("b", null, "Fix: ")), cd.fix, ctx)); }
        g.appendChild(card);
      });
      box.appendChild(g);
    } else if (d.kind === "steps") {
      var ol = el("ol", "next");
      arr(d.steps).slice(0, CARDS_MAX).forEach(function (stp) {
        if (!stp || typeof stp !== "object") { return; }
        var inner = el("div");
        inner.appendChild(rich(el("h3"), stp.title, ctx));
        if (str(stp.text)) { inner.appendChild(rich(el("p"), stp.text, ctx)); }
        ol.appendChild(add(el("li", "card"), inner));
      });
      box.appendChild(ol);
    } else {
      var prose = el("div", "prose");
      String(d.text || "").split("\n").forEach(function (line) {
        if (line) { prose.appendChild(rich(el("p"), line, ctx)); }
      });
      box.appendChild(prose);
    }
    if (d.source) { box.appendChild(el("p", "src", "Source: " + d.source)); }
    return box;
  }

  // A section the sync projected from a repo file (snapshot sections[]): a table or a list; every
  // value is text, and an issue link's href is the issue's own GitHub url, never file content.
  function fileSectionBlock(s, ctx) {
    var box = sectionShell(String(s.title || s.id || ""));
    if (s.kind === "table") {
      var rows = arr(s.rows);
      var any = rows.some(function (r) { return !!r && typeof r === "object" && arr(r.issues).length > 0; });
      var wrap = el("div", "tbl-wrap card"), t = el("table");
      var hr = el("tr");
      arr(s.columns).forEach(function (col) { hr.appendChild(el("th", null, col)); });
      if (any) { hr.appendChild(el("th", null, "Issues")); }
      t.appendChild(el("thead")).appendChild(hr);
      var tb = el("tbody");
      rows.forEach(function (r) {
        if (!r || typeof r !== "object") { return; }
        var tr = el("tr");
        arr(r.cells).forEach(function (cell) { tr.appendChild(el("td", null, cell)); });
        if (any) {
          var td = el("td"), refs = el("div", "refs");
          refPills(refs, r.issues, ctx, false);
          td.appendChild(refs);
          tr.appendChild(td);
        }
        tb.appendChild(tr);
      });
      t.appendChild(tb);
      wrap.appendChild(t);
      box.appendChild(wrap);
    } else if (s.kind === "list") {
      var c = el("div", "issues card");
      arr(s.rows).forEach(function (r) {
        if (!r || typeof r !== "object") { return; }
        var row = el("div", "issue plain");
        row.appendChild(add(el("div", "body"), el("div", null, r.text || "")));
        var st = el("div", "st");
        refPills(st, r.issues, ctx, false);
        row.appendChild(st);
        c.appendChild(row);
      });
      box.appendChild(c);
    }
    if (s.truncated) { box.appendChild(el("p", "src", "(truncated)")); }
    if (s.source) { box.appendChild(el("p", "src", "Source: " + s.source)); }
    return box;
  }

  // One section that cannot be drawn must not blank the page: a failed build is replaced by one
  // text-only muted line, never the error's own message.
  function guardSection(build, s, ctx) {
    try {
      return build(s, ctx);
    } catch (e) {
      var id = s && typeof s === "object" && typeof s.id === "string" && s.id ? s.id : "";
      var box = el("div");
      box.appendChild(el("p", "muted", id ? "Could not render the section " + id + "." : "Could not render a section."));
      return box;
    }
  }
  // The same promise for the page's own blocks: a block that throws is left out.
  function guardBlock(build) {
    try { return build(); } catch (e) { return null; }
  }

  function milestoneBlock(m, issues, ctx) {
    var s = el("section"), hd = el("div", "ms-head"), top = el("div", "ms-top");
    add(top, add(el("h2"), link(String(m.title || ""), m.url)));
    var total = num(m.open) + num(m.closed);
    top.appendChild(el("span", "muted", num(m.closed) + " of " + total + " closed" + (m.dueOn ? " · due " + day(m.dueOn) : "")));
    hd.appendChild(top);
    if (issues.length > 0) { hd.appendChild(segBar(issues, true)); }
    s.appendChild(hd);
    var c = el("div", "issues card");
    issues.forEach(function (i) { c.appendChild(issueRow(i, ctx)); });
    if (issues.length === 0) { c.appendChild(el("div", "empty", "No issues.")); }
    s.appendChild(c);
    return s;
  }

  function render() {
    app.textContent = "";
    var h = model.harness;
    if (failed || !h) {
      headBlock(null);
      app.appendChild(el("div", "notice", failed ? "Live data unavailable: the tracker database could not be reached." : "Waiting for live data..."));
      return;
    }
    var issues = arr(h.issues);
    var byNum = {};
    issues.forEach(function (i) { byNum[i.number] = i; });
    arr(h.refs).forEach(function (i) { if (!byNum[i.number]) { byNum[i.number] = i; } });
    var nar = model.narrative && typeof model.narrative === "object" ? model.narrative : {};
    var ctx = { byNum: byNum, issues: issues, repoUrl: h.repoUrl, notes: nar.notes && typeof nar.notes === "object" ? nar.notes : {} };
    function put(node) { if (node) { app.appendChild(node); } }
    guardBlock(function () { headBlock(h); });
    put(guardBlock(function () { return progressBlock(h, ctx); }));
    put(guardBlock(function () { return standBlock(h, ctx); }));
    put(guardBlock(function () { return waitingBlock(h, ctx); }));
    // Hand-written sections with a negative order sit above the people and shipped blocks, the
    // rest below them.
    var built = model.sections.slice().sort(function (a, b) { return num(a.data.order) - num(b.data.order); })
      .map(function (s) { return { early: num(s.data.order) < 0, node: guardSection(sectionBlock, s, ctx) }; });
    built.forEach(function (b) { if (b.early) { app.appendChild(b.node); } });
    put(guardBlock(function () { return peopleBlock(ctx); }));
    put(guardBlock(function () { return recentBlock(h, ctx); }));
    built.forEach(function (b) { if (!b.early) { app.appendChild(b.node); } });
    arr(h.sections).forEach(function (s) { app.appendChild(guardSection(fileSectionBlock, s, ctx)); });
    var known = {};
    arr(h.milestones).forEach(function (m) {
      known[m.number] = true;
      var mine = issues.filter(function (i) { return i.milestone === m.number; });
      put(guardBlock(function () { return milestoneBlock(m, mine, ctx); }));
    });
    var rest = issues.filter(function (i) { return !known[i.milestone]; });
    if (rest.length > 0) {
      var box = sectionShell("No milestone");
      var c = el("div", "issues card");
      rest.forEach(function (i) { c.appendChild(issueRow(i, ctx)); });
      box.appendChild(c);
      app.appendChild(box);
    }
    var f = el("footer");
    f.appendChild(el("p", null, "The harness rebuilds the GitHub data on every sync. Owners and editors can mark the people items done or reopen them. Nothing on this page ever changes GitHub; comment on the linked issue instead."));
    if (str(nar.updated)) { f.appendChild(el("p", null, "Notes and written sections last refreshed " + day(nar.updated) + ".")); }
    app.appendChild(f);
  }

  function collect(snap) {
    var out = [];
    snap.docs.forEach(function (d) { if (docExists(d)) { out.push({ id: d.id, data: d.data() || {} }); } });
    return out;
  }

  async function start() {
    if (!window.claude || typeof window.claude.use !== "function") { failed = true; render(); return; }
    var timer = setTimeout(function () {
      if (!model.harness) { failed = true; render(); }
    }, 10000);
    try {
      var db = await window.claude.use("db");
      if (!db) { clearTimeout(timer); failed = true; render(); return; }
      var user = await window.claude.use("user");
      model.db = db;
      if (user) {
        var w = await user.can("data.write");
        if (w === null || w === undefined) { w = await user.canEdit(); }
        model.canWrite = !!w;
      }
      db.doc("harness/state").onSnapshot(function (snap) {
        model.harness = docExists(snap) ? snap.data() : null;
        if (model.harness) { failed = false; clearTimeout(timer); }
        render();
      });
      db.doc("harness/narrative").onSnapshot(function (snap) {
        model.narrative = docExists(snap) ? snap.data() : null;
        render();
      });
      db.collection("sections").onSnapshot(function (snap) { model.sections = collect(snap); render(); });
      db.collection("people").onSnapshot(function (snap) { model.people = collect(snap); render(); });
    } catch (e) {
      clearTimeout(timer);
      failed = true;
      render();
    }
  }
  render();
  start();
})();
</script>
